[package]
name = "mtrans"
version = "0.1.0"
edition = "2021"
description = "A CLI tool for translation using LLM API"
authors = ["mtrans"]

[[bin]]
name = "mtrans"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# HTTP client for API calls
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration management
dirs = "5.0"
toml = "0.8"

# Encryption
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hostname = "0.4"

# Clipboard support
arboard = "3.4"

# File I/O
anyhow = "1.0"
thiserror = "1.0"

# Color output
colored = "2.1"

# Interactive input
reedline = "0.34"

# Streaming output
futures = "0.3"
async-stream = "0.3"

[dev-dependencies]
tokio-test = "0.4"
